<!DOCTYPE html>
<html>

<head>

  <script>
    (function () {
      const user = localStorage.getItem("loggedInUser");
      const page = window.location.pathname;

      if (!user && (
        page.includes("found-items") ||
        page.includes("lost-items") ||
        page.includes("my-items") ||
        page.includes("report-item")
      )) {
        window.location.replace("login.html");
      }
    })();
  </script>

  <title>Lost Items | CampusFind</title>

  <link rel="stylesheet" href="css/style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="navbar">

<div class="logo">
CampusFind Portal
</div>

<nav>
<a href="index.html">Home</a>
<a href="lost-items.html">Lost Items</a>
<a href="found-items.html">Found Items</a>
<a href="report-item.html">Report Item</a>
<a href="my-items.html">My Items</a>
<a href="admin.html" id="adminLink" style="display:none;">Admin</a>
</nav>

</header>

<section class="items-section">

<h1>Lost Items</h1>

<input 
type="text" 
id="searchInput" 
placeholder="Search lost items..."
class="search-bar"
>

<div class="items-grid" id="lostItems"></div>

</section>

<script src="js/lost-items.js"></script>
<script src="js/navbar.js"></script>

</body>
</html>
